<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Restricted - Sample</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #000000, #1a1a1a);
            color: #FFD700;
            font-family: 'Courier New', monospace;
            text-align: center;
            line-height: 1.6;
        }
        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            text-align: left;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            padding: 30px;
        }
        h1, h2 {
            text-align: center;
            animation: neonGlow 1.5s infinite alternate;
        }
        @keyframes neonGlow {
            0% { text-shadow: 0 0 5px #FFD700, 0 0 10px #FFD700, 0 0 20px #FFD700; }
            50% { text-shadow: 0 0 10px #FFEA00, 0 0 20px #FFEA00, 0 0 30px #FFEA00; }
            100% { text-shadow: 0 0 5px #FFD700, 0 0 10px #FFD700, 0 0 20px #FFD700; }
        }
        .back-link {
            font-size: 1.3em;
            display: inline-block;
            color: #00FF00;
            text-decoration: none;
            border: 2px solid #00FF00;
            padding: 10px;
            border-radius: 10px;
            margin-top: 30px;
            transition: all 0.3s ease-in-out;
        }
        .back-link:hover {
            background: #00FF00;
            color: black;
            box-shadow: 0 0 10px #00FF00;
        }
        .content-box {
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #FFD700;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }
        iframe {
            width: 100%;
            height: 700px;
            border: none;
            background: #0a0a0a;
            box-shadow: inset 0 0 20px rgba(255, 215, 0, 0.3);
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cyber Restricted</h1>
        <h2>Book One</h2>
        <p><em>Now displaying content from an external PDF file.</em></p>
        <div class="content-box">
            <iframe src="sample.pdf"></iframe>
        </div>
        <a href="index.html" class="back-link">Back to Main Page</a>
    </div>
</body>
</html>
