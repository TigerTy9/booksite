<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Reward</title>
    <style>
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            text-align: center;
            padding-top: 50px;
        }

        .pdf-container {
            width: 100%;
            height: 80vh;
            margin-top: 30px;
            display: none; /* Initially hide the PDF viewer */
        }

        .error-message {
            font-size: 1.5em;
            color: red;
            margin-top: 50px;
        }

        .congratulations-message {
            font-size: 2em;
            margin-bottom: 30px;
        }
    </style>
    <script>
        async function checkAccess() {
            const token = localStorage.getItem("jwt");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch("/api/rewards/check", {
                    method: "POST",
                    headers: { 
                        "Authorization": "Bearer " + token,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ rewardId: 6 })
                });

                const data = await response.json();
                console.log("Reward unlock check:", data); // Debugging log to see the response

                // Display the congratulatory message regardless of the reward status
                const messageDiv = document.createElement('div');
                messageDiv.classList.add('congratulations-message');
                messageDiv.innerHTML = '🎉 Congratulations! You\'ve unlocked this special reward!';
                document.body.appendChild(messageDiv);

                if (!data.unlocked) {
                    // If the reward isn't unlocked, show an error message
                    const errorMessage = document.createElement('div');
                    errorMessage.classList.add('error-message');
                    errorMessage.innerHTML = 'You have not unlocked this reward yet. Please check the catalogue.';
                    document.body.appendChild(errorMessage);
                } else {
                    // If unlocked, display the PDF viewer
                    showPDF();
                }
            } catch (error) {
                console.error("Error verifying reward:", error);
                // If error, show an error message
                const errorMessage = document.createElement('div');
                errorMessage.classList.add('error-message');
                errorMessage.innerHTML = 'There was an issue verifying your reward. Please try again later.';
                document.body.appendChild(errorMessage);
            }
        }

        function showPDF() {
            // Create an iframe to show the PDF
            const pdfContainer = document.createElement('div');
            pdfContainer.classList.add('pdf-container');
            const iframe = document.createElement('iframe');
            iframe.src = 'MortPhobus.pdf'; // Set the path to the PDF
            iframe.width = '100%';
            iframe.height = '100%';
            iframe.type = 'application/pdf';
            pdfContainer.appendChild(iframe);

            // Append the PDF container to the body and make it visible
            document.body.appendChild(pdfContainer);
            pdfContainer.style.display = 'block'; // Make the PDF visible
        }

        window.onload = checkAccess;
    </script>
</head>
<body>
    <div id="inject-menu"></div>
    <script>
        fetch('/menu7.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('inject-menu').innerHTML = html;
            
                // OPTIONAL: Populate user and rebellion level dynamically
                document.getElementById('user-name').textContent = 'Ty';
                document.getElementById('rebellion-lvl').textContent = '7';
            });
    </script>
</body>
</html>
