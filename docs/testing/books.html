<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Restricted Series - Ty Thomasson</title>
    <style>
        body {
            background-color: #0a0a0a;
            font-family: 'Arial', sans-serif;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        header {
            text-align: center;
            padding: 50px;
            background-color: #111;
        }

        header h1 {
            font-size: 3em;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .book-container {
            display: flex;
            justify-content: space-around;
            padding: 50px 20px;
            flex-wrap: wrap;
        }

        .book {
            width: 300px;
            margin: 20px;
            text-align: center;
            background: #111;
            border: 2px solid #fff;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .book:hover {
            transform: scale(1.05);
        }

        .book img {
            width: 100%;
            height: auto;
            object-fit: cover;
        }

        .book-title {
            font-size: 1.5em;
            margin: 20px 0;
            color: #f1c40f;
        }

        .book-description {
            font-size: 1em;
            color: #fff;
            padding: 10px;
        }

        .author {
            font-size: 1em;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Cyber Restricted Series</h1>
    <p>By Ty Thomasson</p>
</header>

<div class="book-container">
    <div class="book">
        <img src="book-cover.jpg" alt="Cyber Restricted">
        <div class="book-title">Cyber Restricted</div>
        <p class="book-description">A gripping tale of technology, secrets, and rebellion in a dystopian world.</p>
        <p class="author">By Ty Thomasson</p>
    </div>

    <!-- Add more books here as your series expands -->
    <div class="book">
        <img src="CyberConfinedCover.PNG" alt="Cyber Confined">
        <div class="book-title">Cyber Confined</div>
        <p class="book-description">The next chapter in the Cyber Restricted series, diving deeper into the world of tech and control.</p>
        <p class="author">By Ty Thomasson</p>
    </div>
</div>

</body>
</html>
