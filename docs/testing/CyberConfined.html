<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Restricted - Author's Site</title>
    <style>
        body {
            background-color: #000;
            font-family: 'Arial', sans-serif;
            color: #fff;
            margin: 0;
            padding: 0;
        }

        .cover-container {
            position: relative;
            text-align: center;
            color: #fff;
            padding-top: 50px;
        }

        .cover-container h1 {
            font-size: 4em;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.5), 0 0 40px rgba(255, 255, 255, 0.3);
        }

        .cover-container img {
            width: 80%;
            max-width: 600px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.4));
        }

        .glitch {
            animation: glitch-animation 1.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-animation {
            0% { text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.8), -2px -2px 10px rgba(0, 0, 255, 0.8); }
            25% { text-shadow: -2px 2px 15px rgba(255, 255, 255, 0.8), 2px -2px 15px rgba(255, 0, 0, 0.8); }
            50% { text-shadow: 2px -2px 10px rgba(255, 255, 255, 0.8), -2px 2px 10px rgba(0, 0, 255, 0.8); }
            75% { text-shadow: -2px -2px 15px rgba(255, 255, 255, 0.7), 2px 2px 15px rgba(255, 0, 0, 0.7); }
            100% { text-shadow: 2px 2px 10px rgba(255, 0, 0, 0.8), -2px -2px 10px rgba(0, 0, 255, 0.8); }
        }
    </style>
</head>
<body>

<div class="cover-container">
    <h1 class="glitch">Cyber Confined</h1>
    <img src="CyberConfinedCover.PNG">
</div>

</body>
</html>
